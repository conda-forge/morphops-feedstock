{% set name = "morphops" %}
{% set version = "0.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f9929eb28b9cbe70b13f33b7d6ce1046aa9591ec64972ee342c4a6b77f4d5dda

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77.0.3
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - scipy >=1.12

test:
  imports:
    - morphops
    - morphops.io
    - morphops.lmk_util
    - morphops.procrustes
    - morphops.tps
  requires:
    - pytest >=8
    - pip
    - python {{ python_min }}.*
  commands:
    - pip check
    - pytest --pyargs morphops

about:
  home: https://morphops.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Geometric Morphometrics in Python'
  description: |
    morphops implements common operations and algorithms for Geometric
    Morphometrics, in Python 3. Features include centering and rescaling data,
    rigid rotation, ordinary and generalized procrustes alignment, thin-plate
    spline warping, and reading from and writing to *.dta files.
  doc_url: https://morphops.readthedocs.io
  dev_url: https://github.com/vaipatel/morphops

extra:
  recipe-maintainers:
    - vaipatel
    - hakonanes
